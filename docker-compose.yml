services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    restart: unless-stopped
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    volumes:
      - app_data:/app/data
    depends_on:
      - redis
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  worker:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info --concurrency=1
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    volumes:
      - app_data:/app/data
    depends_on:
      - redis
      - backend

  beat:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    restart: unless-stopped
    command: celery -A celery_app beat --loglevel=info --scheduler celery.beat.PersistentScheduler
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    volumes:
      - app_data:/app/data
    depends_on:
      - redis

  frontend:
    build:
      context: web/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - app_data:/app/data:ro
    depends_on:
      - backend

volumes:
  redis_data:
  app_data:
